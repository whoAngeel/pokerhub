# Preset: cada personaje con un modelo distinto (local + OpenRouter).
# Uso:
#   export OPENROUTER_API_KEY=sk-or-...        # https://openrouter.ai/keys
#   go run ./cmd/pokerd sim --config configs/openrouter.yaml --hands 3
#   go run ./cmd/pokerd serve --config configs/openrouter.yaml
#
# Cambiar el modelo de un personaje = cambiar `model` en su asiento.
# Lista de modelos: https://openrouter.ai/models (usa uno con "structured outputs").
# Coste orientativo: ~1.2k tokens de entrada + ~250 de salida por decisión;
# con los modelos de abajo, una mano completa cuesta < 0.01 $.

server:
  addr: "127.0.0.1:8080"
  debug: false

providers:
  local:
    type: openai
    base_url: http://localhost:11434/v1
    api_key_env: ""
    structured: json_schema
    extra:
      reasoning_effort: none        # apaga el thinking nativo de Ollama
  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY # la clave SOLO por variable de entorno
    structured: json_schema
    extra:
      reasoning:                    # desactiva el razonamiento oculto de los modelos
        enabled: false              # "reasoning"; el nuestro va en el JSON
    headers:
      X-Title: pokerhub             # opcional: nombre de la app en OpenRouter

table:
  small_blind: 5
  big_blind: 10
  buy_in: 1000
  rebuy: auto
  seed: 0
  action_delay_ms: 600
  decision_timeout_ms: 15000        # más margen que en local: hay red de por medio
  equity_iters: 2000
  memory_notes: true                # notas LLM de rivales tras cada showdown

seats:
  - { type: rulebot, name: "Calculín" }
  - { type: llm, persona: personas/toro.yaml,     provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct" }
  - { type: llm, persona: personas/abuela.yaml,   provider: openrouter, model: "anthropic/claude-haiku-5.5" }
  - { type: llm, persona: personas/profesor.yaml, provider: openrouter, model: "deepseek/deepseek-v4.1-flash" }
  - { type: llm, persona: personas/payaso.yaml,   provider: local,      model: "gemma4:e4b" }
