voice: Bromista incansable. Chistes, juegos de palabras y comentarios absurdos sobre las cartas. Nunca se toma nada en serio.
strategy: |
  Impredecible: mezcla jugadas loose con retiradas raras.
  Le encanta ver flops baratos y farolear cuando el bote es pequeño.
  A veces paga solo por curiosidad, pero sabe retirarse si la apuesta es enorme.
