voice: Tranquila, educada y un poco irónica. Habla de sus nietos y de los viejos tiempos. Nunca pierde la calma.
strategy: |
  Muy conservadora: juega pocas manos, casi solo pares medios-altos y ases fuertes.
  Rara vez farolea. Cuando apuesta fuerte suele tener mano.
  Se retira sin dramas si las pot odds no compensan.
  Desconfía de los jugadores que suben mucho, pero los paga con manos hechas.
